name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          # pywin32's COM support (pythoncomXX.dll / pywintypesXX.dll) lives
          # outside the normal package tree and PyInstaller's import scan
          # doesn't pick it up on its own; without it Excel COM automation
          # fails at runtime with a DLL/import error right when printing
          # starts. Bundle those DLLs explicitly.
          $sitePkg = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $pywinSys32 = Join-Path $sitePkg "pywin32_system32"
          $addBinaryArgs = @()
          foreach ($dll in Get-ChildItem -Path $pywinSys32 -Filter "*.dll") {
            $addBinaryArgs += "--add-binary"
            $addBinaryArgs += "$($dll.FullName);."
          }

          pyinstaller --onefile --console --name BarcodePrinter `
            --collect-all pyzbar `
            --collect-all openpyxl `
            --hidden-import win32timezone `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            @addBinaryArgs `
            print_order.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcodePrinter-windows-exe
          path: dist/BarcodePrinter.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BarcodePrinter.exe
