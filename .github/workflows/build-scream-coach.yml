name: Build Scream Coach exe

# Every push builds the Windows installer. Pushes to the default branch also
# publish it as a GitHub Release (vX.Y.<run number>), which installed copies
# of the app pick up through auto-update.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch: {}

permissions:
  contents: write # create releases

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Each build gets a higher version so the updater sees it as new.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build installer (and publish the release on the default branch)
        shell: bash
        # No code-signing certificate: skip signing instead of searching for one.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish "$([ "$PUBLISH" = true ] && echo always || echo never)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreamCoach-windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
