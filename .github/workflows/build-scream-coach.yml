name: Build Scream Coach exe

# Every push builds the Windows installer. Pushes to the default branch also
# publish it as a GitHub Release (vX.Y.<run number>), which installed copies
# of the app pick up through auto-update.
#
# Versions come from run_number, which restarts at 1 if this file is renamed
# or recreated: bump the X.Y in package.json then, or installed apps would see
# every new release as older than what they have.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch: {}

permissions:
  contents: write # create releases

# One build per branch at a time, in push order, so releases can't overtake
# each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Each build gets a higher version so the updater sees it as new.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code-signing certificate
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreamCoach-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      # One release with all three files, published only once they're all up
      # (gh uploads to a draft first), and only if it's newer than the current
      # latest release (a re-run of an old build must not win). Publishing is
      # done here rather than by electron-builder, whose parallel uploads each
      # created their own draft and split the files between them.
      - name: Publish release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=("dist/ScreamCoach-Setup-$VERSION.exe" "dist/ScreamCoach-Setup-$VERSION.exe.blockmap" dist/latest.yml)
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          grep -q "^version: $VERSION$" dist/latest.yml || { echo "::error::latest.yml is not for $VERSION"; exit 1; }

          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && ! node -e '
            const a = process.argv[1].split(".").map(Number);
            const b = process.argv[2].replace(/^v/, "").split(".").map(Number);
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1);
            process.exit(1);
          ' "$VERSION" "$latest"; then
            echo "v$VERSION is not newer than $latest; not publishing."
            exit 0
          fi

          # Drafts are never used for updates; drop leftovers from failed runs.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Scream Coach $VERSION" --notes "Install once with ScreamCoach-Setup-$VERSION.exe; installed copies update automatically." --latest
          echo "Published v$VERSION."
